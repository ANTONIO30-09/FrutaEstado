<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrutaEstado — Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .login-card { width: 100%; max-width: 420px; padding: 3rem 2.5rem; text-align: center; }
    .login-card h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .login-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label { font-size: 0.85rem; color: var(--text-soft); margin-bottom: 0.5rem; display: block; }
    .form-group input { width: 100%; background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 0.8rem 1rem; color: var(--white); font-family: inherit; font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: var(--mint); box-shadow: 0 0 10px rgba(140, 230, 140, 0.2); }
    .btn-primary { width: 100%; padding: 0.9rem; background: var(--emerald); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: 0.2s; }
    .btn-primary:hover { background: var(--forest); transform: translateY(-2px); }
    .toggle-mode { margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
    .toggle-mode:hover { color: var(--white); }
    #error-msg { color: #ff4b4b; font-size: 0.85rem; margin-top: 1rem; display: none; background: rgba(255,75,75,0.1); padding: 0.5rem; border-radius: 5px;}
    #success-msg { color: #4bb84b; font-size: 0.85rem; margin-top: 1rem; display: none; background: rgba(75,184,75,0.1); padding: 0.5rem; border-radius: 5px;}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card glass">
      <h2 id="form-title">Iniciar Sesión</h2>
      <p id="form-subtitle">Ingresa tus credenciales para acceder al sistema</p>
      
      <form id="auth-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary" id="btn-submit">Entrar al Dashboard</button>
        <div id="error-msg"></div>
        <div id="success-msg"></div>
      </form>
      
      <div class="toggle-mode" id="toggle-mode">
        ¿No tienes cuenta? <strong>Regístrate aquí</strong>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // TUS LLAVES DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyByxfM7GLJ2DVxn4JXbu6hnyvTjdeu7rFs",
      authDomain: "frutaestado.firebaseapp.com",
      projectId: "frutaestado",
      storageBucket: "frutaestado.firebasestorage.app",
      messagingSenderId: "41075862847",
      appId: "1:41075862847:web:f7ac06769f170f6079778a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLoginMode = true;

    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const subtitle = document.getElementById('form-subtitle');
    const btnSubmit = document.getElementById('btn-submit');
    const toggleBtn = document.getElementById('toggle-mode');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    // Cambiar entre Login y Registro
    toggleBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      if (isLoginMode) {
        title.textContent = "Iniciar Sesión";
        subtitle.textContent = "Ingresa tus credenciales para acceder al sistema";
        btnSubmit.textContent = "Entrar al Dashboard";
        toggleBtn.innerHTML = "¿No tienes cuenta? <strong>Regístrate aquí</strong>";
      } else {
        title.textContent = "Crear Cuenta";
        subtitle.textContent = "Regístrate para monitorear tus frutas";
        btnSubmit.textContent = "Registrarse";
        toggleBtn.innerHTML = "¿Ya tienes cuenta? <strong>Inicia sesión aquí</strong>";
      }
    });

    // Enviar formulario
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      btnSubmit.textContent = "Cargando...";
      btnSubmit.disabled = true;

      try {
        let userCredential;
        if (isLoginMode) {
          userCredential = await signInWithEmailAndPassword(auth, email, password);
        } else {
          userCredential = await createUserWithEmailAndPassword(auth, email, password);
        }

        // Obtenemos el token y lo enviamos a nuestro servidor Flask
        const token = await userCredential.user.getIdToken();
        
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        });

        if (response.ok) {
          window.location.href = "/"; // Redirigir al dashboard
        } else {
          throw new Error("Error al validar en el servidor");
        }

      } catch (error) {
        errorMsg.style.display = 'block';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errorMsg.textContent = "Correo o contraseña incorrectos.";
        } else if (error.code === 'auth/email-already-in-use') {
          errorMsg.textContent = "Este correo ya está registrado.";
        } else if (error.code === 'auth/weak-password') {
          errorMsg.textContent = "La contraseña debe tener al menos 6 caracteres.";
        } else {
          errorMsg.textContent = "Error: " + error.message;
        }
        btnSubmit.textContent = isLoginMode ? "Entrar al Dashboard" : "Registrarse";
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
